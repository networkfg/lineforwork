name: macOS Sunshine + Tailscale (experimental)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Runtime (5-180 minutes)'
        required: true
        default: '30'

permissions:
  contents: read

env:
  SUN_USER: ${{ secrets.SUNSHINE_USER || 'sunshine' }}
  SUN_PASS: ${{ secrets.SUNSHINE_PASS || 'Sunshine@2026' }}

jobs:
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 190
    steps:
      - name: System details
        run: |
          sw_vers
          uname -m
          system_profiler SPDisplaysDataType || true
          echo "Console user: $(stat -f %Su /dev/console)"

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-macos-sunshine

      - name: Install Sunshine
        run: |
          mkdir -p "$RUNNER_TEMP/diag"

          # remove taps quebrados que poluem o log
          brew untap hashicorp/tap 2>/dev/null || true
          brew untap aws/tap 2>/dev/null || true

          brew update 2>&1 | tail -n 5
          brew tap LizardByte/homebrew

          if brew install lizardbyte/homebrew/sunshine 2>&1 | tee "$RUNNER_TEMP/diag/install.log"; then
            echo "Sunshine instalado via Homebrew"
          else
            echo "Homebrew falhou, tentando instalar icu4c@78 e refazer..."
            brew install icu4c@78 || true
            brew install lizardbyte/homebrew/sunshine 2>&1 | tee -a "$RUNNER_TEMP/diag/install.log" || {
              echo "Fallback: baixando release oficial"
              URL="$(curl -s https://api.github.com/repos/LizardByte/Sunshine/releases/latest \
                | jq -r '.assets[] | select(.name | test("macos|darwin|\\.dmg"; "i")) | .browser_download_url' | head -n1)"
              echo "Asset: $URL"
              [ -n "$URL" ] || { echo "Nenhum asset macOS encontrado na release"; exit 1; }
              curl -L "$URL" -o "$RUNNER_TEMP/sunshine.pkg_or_dmg"
              ls -lh "$RUNNER_TEMP/sunshine.pkg_or_dmg"
            }
          fi

          command -v sunshine || ls -ld /Applications/Sunshine.app 2>/dev/null

      - name: Start Sunshine
        run: |
          sunshine --creds "$SUN_USER" "$SUN_PASS"
          nohup sunshine > "$RUNNER_TEMP/diag/sunshine.log" 2>&1 < /dev/null &
          sleep 12
          pgrep -fl sunshine
          curl -k -I --connect-timeout 3 https://127.0.0.1:47990 | tee "$RUNNER_TEMP/diag/webui.txt"

      - name: Generate Tailscale links
        run: |
          TS_IP="$(tailscale ip -4 | head -n1)"
          TS_DNS="$(tailscale status --json | jq -r '.Self.DNSName' | sed 's/\.$//')"

          {
            echo "## Sunshine + Tailscale"
            echo ""
            echo "| Item | Valor |"
            echo "|------|-------|"
            echo "| Web UI (IP) | https://$TS_IP:47990 |"
            echo "| Web UI (DNS) | https://$TS_DNS:47990 |"
            echo "| Moonlight (adicionar host) | $TS_IP |"
            echo "| Usuário | $SUN_USER |"
            echo "| Senha | $SUN_PASS |"
          } | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/diag/links.md"

          echo ""
          echo "==> Web UI: https://$TS_IP:47990"
          echo "==> Moonlight: $TS_IP"

      - name: Hold runner
        env:
          REQUESTED_MINUTES: ${{ inputs.minutes }}
        run: |
          [[ "$REQUESTED_MINUTES" =~ ^[0-9]+$ ]] || exit 1
          n=$((10#$REQUESTED_MINUTES))
          (( n >= 5 && n <= 180 )) || { echo 'minutes must be 5-180'; exit 1; }
          sleep "$((n * 60))"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-sunshine-diagnostics
          path: ${{ runner.temp }}/diag/
          if-no-files-found: ignore
