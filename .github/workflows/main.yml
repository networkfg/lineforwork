name: macOS Sunshine + Tailscale (experimental)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Runtime (5-180 minutes)'
        required: true
        default: '30'

permissions:
  contents: read

env:
  SUN_USER: ${{ secrets.SUNSHINE_USER || 'sunshine' }}
  SUN_PASS: ${{ secrets.SUNSHINE_PASS || 'Sunshine@2026' }}

jobs:
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 190
    steps:
      - name: System details
        run: |
          sw_vers
          uname -m
          system_profiler SPDisplaysDataType || true
          echo "Console user: $(stat -f %Su /dev/console)"

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-macos-sunshine

      - name: Install Sunshine
        timeout-minutes: 30
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ENV_HINTS: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
          NONINTERACTIVE: 1
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/diag"

          curl -s https://api.github.com/repos/LizardByte/Sunshine/releases/latest \
            > "$RUNNER_TEMP/diag/release.json"
          jq -r '.assets[].name' "$RUNNER_TEMP/diag/release.json" | tee "$RUNNER_TEMP/diag/assets.txt"

          URL="$(jq -r '.assets[] | select(.name | test("macos|darwin|\\.dmg"; "i")) | .browser_download_url' \
            "$RUNNER_TEMP/diag/release.json" | head -n1)"

          if [ -n "$URL" ]; then
            echo "Binario pronto encontrado: $URL"
            FILE="$RUNNER_TEMP/$(basename "$URL")"
            curl -L "$URL" -o "$FILE"
            case "$FILE" in
              *.pkg)
                sudo installer -pkg "$FILE" -target /
                ;;
              *.dmg)
                MNT="$(hdiutil attach "$FILE" -nobrowse | grep -o '/Volumes/.*' | head -n1)"
                echo "Montado em: $MNT"
                APP="$(find "$MNT" -maxdepth 2 -name '*.app' | head -n1)"
                sudo cp -R "$APP" /Applications/
                hdiutil detach "$MNT" || true
                ;;
              *.tar.gz|*.zip)
                echo "Arquivo compactado, veja assets.txt para ajustar a extracao"
                exit 1
                ;;
            esac
          else
            echo "Sem binario macOS na release. Compilando via Homebrew (lento)..."
            brew tap LizardByte/homebrew
            brew install icu4c@78 || true
            brew install lizardbyte/homebrew/sunshine 2>&1 | tee "$RUNNER_TEMP/diag/install.log"
          fi

          command -v sunshine || ls -ld /Applications/Sunshine.app

      - name: Start Sunshine
        run: |
          SUN_BIN="$(command -v sunshine || true)"
          if [ -z "$SUN_BIN" ]; then
            SUN_BIN="/Applications/Sunshine.app/Contents/MacOS/sunshine"
          fi
          echo "Usando: $SUN_BIN"

          "$SUN_BIN" --creds "$SUN_USER" "$SUN_PASS" || true
          nohup "$SUN_BIN" > "$RUNNER_TEMP/diag/sunshine.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/diag/pid"
          sleep 15

          pgrep -fl sunshine || { echo "Sunshine nao esta rodando"; tail -n 50 "$RUNNER_TEMP/diag/sunshine.log"; exit 1; }
          (curl -k -I --connect-timeout 3 https://127.0.0.1:47990 || true) | tee "$RUNNER_TEMP/diag/webui.txt"
          tail -n 30 "$RUNNER_TEMP/diag/sunshine.log" || true

      - name: Generate Tailscale links
        run: |
          TS_IP="$(tailscale ip -4 | head -n1)"
          TS_DNS="$(tailscale status --json | jq -r '.Self.DNSName' | sed 's/\.$//')"

          {
            echo "## Sunshine + Tailscale"
            echo ""
            echo "| Item | Valor |"
            echo "|------|-------|"
            echo "| Web UI (IP) | https://$TS_IP:47990 |"
            echo "| Web UI (DNS) | https://$TS_DNS:47990 |"
            echo "| Moonlight (adicionar host) | $TS_IP |"
            echo "| Usuario | $SUN_USER |"
            echo "| Senha | $SUN_PASS |"
          } | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/diag/links.md"

          echo ""
          echo "==> Web UI: https://$TS_IP:47990"
          echo "==> Moonlight: $TS_IP"

      - name: Hold runner
        env:
          REQUESTED_MINUTES: ${{ inputs.minutes }}
        run: |
          [[ "$REQUESTED_MINUTES" =~ ^[0-9]+$ ]] || exit 1
          n=$((10#$REQUESTED_MINUTES))
          (( n >= 5 && n <= 180 )) || { echo 'minutes must be 5-180'; exit 1; }
          echo "Aguardando $n minutos..."
          sleep "$((n * 60))"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-sunshine-diagnostics
          path: ${{ runner.temp }}/diag/
          if-no-files-found: ignore
