name: macOS VNC + Tailscale (experimental)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Runtime (5-180 minutes)'
        required: true
        default: '30'

permissions:
  contents: read

env:
  # Senha VNC legada aceita no maximo 8 caracteres
  VNC_PASS: ${{ secrets.VNC_PASS || 'Vnc@2026' }}

jobs:
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 190
    steps:
      - name: System details
        run: |
          sw_vers
          uname -m
          system_profiler SPDisplaysDataType || true
          echo "Usuario: $(whoami)"

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-macos-vnc

      - name: Enable Screen Sharing (VNC)
        run: |
          mkdir -p "$RUNNER_TEMP/diag"

          # Define a senha do usuario da sessao (usada no login do Screen Sharing)
          sudo dscl . -passwd "/Users/$(whoami)" "$VNC_PASS" || true

          # Ativa Remote Management / VNC com senha
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "$VNC_PASS" \
            -restart -agent -privs -all 2>&1 | tee "$RUNNER_TEMP/diag/kickstart.log"

          # Tenta tambem o Screen Sharing nativo
          sudo launchctl enable system/com.apple.screensharing 2>/dev/null || true
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true

          sleep 8
          echo "--- Portas ---"
          sudo lsof -iTCP:5900 -sTCP:LISTEN | tee "$RUNNER_TEMP/diag/port5900.txt" || echo "Porta 5900 NAO esta escutando"
          nc -zv 127.0.0.1 5900 2>&1 | tee -a "$RUNNER_TEMP/diag/port5900.txt" || true

      - name: Generate Tailscale links
        run: |
          TS_IP="$(tailscale ip -4 | head -n1)"
          TS_DNS="$(tailscale status --json | jq -r '.Self.DNSName' | sed 's/\.$//')"
          USER_NAME="$(whoami)"

          {
            echo "## VNC + Tailscale"
            echo ""
            echo "| Item | Valor |"
            echo "|------|-------|"
            echo "| Endereco VNC (IP) | vnc://$TS_IP:5900 |"
            echo "| Endereco VNC (DNS) | vnc://$TS_DNS:5900 |"
            echo "| Usuario (login Mac) | $USER_NAME |"
            echo "| Senha | $VNC_PASS |"
          } | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/diag/links.md"

          echo ""
          echo "==> Conecte em: vnc://$TS_IP:5900"

      - name: Hold runner
        env:
          REQUESTED_MINUTES: ${{ inputs.minutes }}
        run: |
          [[ "$REQUESTED_MINUTES" =~ ^[0-9]+$ ]] || exit 1
          n=$((10#$REQUESTED_MINUTES))
          (( n >= 5 && n <= 180 )) || { echo 'minutes must be 5-180'; exit 1; }
          echo "Aguardando $n minutos..."
          sleep "$((n * 60))"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-vnc-diagnostics
          path: ${{ runner.temp }}/diag/
          if-no-files-found: ignore
